name: Publish scheduled posts

# Every 10 minutes: asks the CRM to publish posts whose scheduled time for the
# mini app / Telegram channels has passed (crm/src/app/api/cron/publish).
# GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due jobs
        env:
          CRM_URL: ${{ vars.CRM_URL || 'https://agenturicrm.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer ${CRON_SECRET}" "${CRM_URL}/api/cron/publish"

      # The CRM did not answer: tell the agency on Telegram (at most every 3 hours).
      - uses: actions/checkout@v4
        if: failure()
      - uses: actions/setup-python@v5
        if: failure()
        with:
          python-version: "3.11"
      - name: Tell the agency the publisher failed
        if: failure()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check -q requests==2.32.5 beautifulsoup4==4.13.5 "psycopg[binary]==3.2.9"
          python ops_alert.py --failed "Scheduled posts (CRM)"
